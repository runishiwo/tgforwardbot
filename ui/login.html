<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c1c">
<meta name="color-scheme" content="dark">
<title>ForwardBot 登录</title>
<style>
  :root{
    --bg:oklch(.162 .034 277); --panel:oklch(.219 .030 278); --panel2:oklch(.263 .021 277);
    --border:oklch(.288 .026 275); --border2:oklch(.368 .030 277);
    --text:oklch(.955 .008 271); --muted:oklch(.749 .026 273); --faint:oklch(.603 .032 275);
    --accent:oklch(.791 .134 220); --ok:oklch(.867 .134 165); --err:oklch(.704 .160 15);
    --sunken:oklch(.144 .039 275); --glow-a:oklch(.599 .230 286);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;
    /* 与管理台同一套极光晕染：右上薄荷 + 左下紫 */
    background:
      radial-gradient(1000px 620px at 92% -10%,color-mix(in oklab,var(--ok) 11%,transparent),transparent 60%),
      radial-gradient(880px 640px at 4% 108%,color-mix(in oklab,var(--glow-a) 20%,transparent),transparent 62%),
      radial-gradient(760px 520px at 46% 46%,color-mix(in oklab,var(--accent) 6%,transparent),transparent 72%),
      var(--bg);
    background-attachment:fixed;
    font-family:"MiSans-VF",-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    color:var(--text);-webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:390px;margin:16px;padding:42px 38px 34px;
    background:var(--panel);border:1px solid var(--border);border-radius:20px;
    box-shadow:0 30px 70px -25px oklch(0 0 0 / .85), inset 0 1px 0 0 oklch(1 0 0 / .04);
    animation:rise .42s var(--ease);
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .logo{
    width:54px;height:54px;margin:0 auto 20px;border-radius:16px;
    background:var(--accent);color:var(--bg);
    display:flex;align-items:center;justify-content:center;
  }
  .logo svg{width:27px;height:27px}
  h1{margin:0 0 6px;font-size:21px;text-align:center;letter-spacing:-.012em}
  .sub{margin:0 0 28px;text-align:center;color:var(--faint);font-size:13px}
  label{display:block;margin-bottom:7px;font-size:12.5px;color:var(--muted)}
  .wrap{position:relative;margin-bottom:18px}
  input[type=password],input[type=text]{
    width:100%;padding:12px 44px 12px 14px;font-size:16px;
    background:var(--sunken);color:var(--text);border:1px solid var(--border2);
    border-radius:11px;outline:none;font-family:inherit;
    transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
  }
  input:focus{border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
  .eye{
    position:absolute;right:7px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;padding:7px;color:var(--faint);border-radius:8px;
  }
  .eye:hover{color:var(--text);background:var(--panel2)}
  button.go{
    width:100%;padding:13px;font-size:15px;font-weight:600;letter-spacing:1px;
    background:var(--accent);color:var(--bg);border:none;border-radius:11px;cursor:pointer;
    font-family:inherit;transition:background .18s var(--ease),transform .18s var(--ease);
  }
  button.go:hover{background:color-mix(in oklab,var(--accent) 86%,white)}
  button.go:active{transform:translateY(1px)}
  .err{
    padding:10px 13px;margin:0 0 16px;border-radius:10px;
    background:color-mix(in oklab,var(--err) 14%,transparent);
    border:1px solid color-mix(in oklab,var(--err) 42%,transparent);
    color:color-mix(in oklab,var(--err) 55%,white);font-size:13px;text-align:center;
  }
  .err:empty{display:none}
  .foot{margin-top:22px;text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:.3px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
    </div>
    <h1>ForwardBot 控制台</h1>
    <p class="sub">请输入访问密码以继续</p>
    <div class="err">${error}</div>
    <form method="post" action="/login">
      <label for="password">访问密码</label>
      <div class="wrap">
        <input type="password" id="password" name="password" autofocus autocomplete="current-password" required>
        <button type="button" class="eye" onclick="togglePw()" title="显示 / 隐藏密码" aria-label="显示 / 隐藏密码">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" class="go">登 录</button>
    </form>
    <div class="foot">Telegram 消息转发 · 实时监听 + 手动转发</div>
  </div>
  <script>
    function togglePw() {
      var inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
