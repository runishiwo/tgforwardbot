    <!-- ============ 手动转发概览 ============ -->
    <section class="view" id="view-dashboard-manual">
      <div class="card">
        <h2>手动转发 · 数据合计</h2>
        <p class="cardsub">下面是「手动转发」类<strong>所有任务各自统计的合计</strong>：某个任务「重新开始」（统计清零）或任务被删除后，这里的数字会同步减少。</p>
        <div class="stat-grid" id="ov-man-stat"></div>
      </div>
      <div class="card">
        <h2>近 7 天趋势 <span class="counter">按自然日累计 · 历史趋势</span></h2>
        <div class="chart" id="ov-man-chart"></div>
        <div class="legend"><span><i></i>转发成功</span><span><i class="b2"></i>转发失败</span></div>
      </div>
      <div class="card">
        <h2>手动任务状态 <span class="counter" id="ov-man-state"></span></h2>
        <div class="kv" id="ov-man-states"></div>
      </div>
      <div class="card">
        <h2>手动任务列表 <span class="counter" id="ov-man-count"></span></h2>
        <p class="cardsub">点任意一条可进入详情，看它自己的日志、统计与转发锚点，也可直接暂停 / 恢复 / 编辑。</p>
        <div id="ov-man-tasks"><div class="empty">加载中…</div></div>
      </div>
    </section>
