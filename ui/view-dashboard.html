    <!-- ============ 概览 ============ -->
    <section class="view active" id="view-dashboard">
      <div class="cat-grid">
        <div class="cat-card" data-group="monitor" onclick="enterCategory('monitor')">
          <div class="ico"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.6"/></svg></div>
          <div>
            <b>实时监控</b>
            <p>多条监控任务并行：每条任务自己选来源频道、目的频道与词表，命中即转发。</p>
            <div class="cnt" id="cat-monitor-cnt">—</div>
            <div class="cb"><button type="button" data-go="monitor">实时任务</button><button type="button" data-go="words">词表管理</button><button type="button" data-go="tasks">任务中心</button></div>
          </div>
        </div>
        <div class="cat-card manual" data-group="manual" onclick="enterCategory('manual')">
          <div class="ico"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-3 7h5l-3 7"/><path d="M3 12h4M17 12h4M5 18h14"/></svg></div>
          <div>
            <b>手动转发</b>
            <p>按频道 + 时间范围补转历史消息，多条任务同时跑，每条任务独立日志。</p>
            <div class="cnt" id="cat-manual-cnt">—</div>
            <div class="cb"><button type="button" data-go="manual">发起转发</button><button type="button" data-go="words">词表管理</button><button type="button" data-go="tasks">任务中心</button></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>今日数据</h2>
        <p class="cardsub">所有任务（实时监控 + 手动转发）汇总，按自然日统计，重启不丢。</p>
        <div class="stat-grid" id="stat-cards"></div>
      </div>

      <div class="card">
        <h2>近 7 天趋势</h2>
        <div class="chart" id="chart"></div>
        <div class="legend"><span><i></i>转发成功</span><span><i class="b2"></i>转发失败</span></div>
      </div>

      <div class="card">
        <h2>运行中的任务 <span class="counter" id="run-count"></span></h2>
        <div id="dash-tasks"><div class="empty">加载中…</div></div>
      </div>
    </section>
